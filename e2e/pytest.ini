[pytest]
# ============================================================
#  DreamCraft Astra - Python E2E 自动化测试配置
#  框架: pytest + pytest-playwright
#  报告: pytest-html (主) + allure (可选)
# ============================================================

# --- 基础配置 ---
minversion = 8.0
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --disable-warnings

# --- 路径配置 ---
rootdir = .
pythonpath = .
testpaths = tests

# --- 报告配置（HTML）---
# 运行示例：pytest --html=reports/report.html --self-contained-html

# --- 标记定义 ---
markers =
    smoke: 冒烟测试 - 核心路径快速验证
    critical: 关键业务流程，必须通过
    e2e: 端到端业务流程
    system: 系统管理模块
    dashboard: 仪表盘模块
    project: 项目管理模块
    script: 剧本管理模块
    storyboard: 分镜管理模块
    video: 视频生成模块
    editor: 剪辑工作台模块
    review: 审核中心模块
    asset: 资产管理模块
    ai_process: AI 处理记录模块
    data_history: 数据历史模块
    workflow: 工作流管理模块
    team: 团队管理模块
    points: 积分管理模块
    notice: 通知中心模块
    settings: 系统设置模块
    auth: 认证模块（登录/注册/忘记密码）
    slow: 慢测试（>10s）
    network: 依赖网络请求的测试
    ui_only: 仅验证 UI 元素与页面切换
    api_verify: 触发 UI 操作后验证后端 API 调用

# --- 超时（单用例默认 60s）---
# 超时可通过命令行覆盖：pytest --timeout=120

# --- 输出 ---
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
