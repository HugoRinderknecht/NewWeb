<!doctype html>
<html>
  <head>
    <title>Dreamcraft_Astra</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dreamcraft_Astra - A modern admin dashboard template built with Vue 3, TypeScript, and Element Plus."
    />
    <link rel="shortcut icon" type="image/x-icon" href="src/assets/images/favicon.ico" />
    <link rel="dns-prefetch" href="//server.bsuniversal.cn" />
    <link rel="preconnect" href="//server.bsuniversal.cn" crossorigin />

    <style>
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }

      #app {
        min-height: 100vh;
      }

      .app-layout {
        display: flex;
        min-height: 100vh;
      }

      #app-sidebar {
        flex-shrink: 0;
        overflow: hidden;
      }

      #app-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }

      #app-content {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
